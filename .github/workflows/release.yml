name: build

on:
  push:
    branches: ['main']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: bedrockdeck-windows-x64
          - os: ubuntu-latest
            name: bedrockdeck-linux-x64
          - os: macos-latest
            name: bedrockdeck-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure and build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item build/Release/bedrockdeck.exe .
          Compress-Archive -Path bedrockdeck.exe,README.md -DestinationPath ${{ matrix.name }}.zip

      - name: Package (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cp build/bedrockdeck .
          tar -czf ${{ matrix.name }}.tar.gz bedrockdeck README.md

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.name }}.zip
            ${{ matrix.name }}.tar.gz
          if-no-files-found: ignore

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
